name: Java CI with Maven + Selenium

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:

    runs-on: ubuntu-latest

    env:
      CI: true

    steps:

    - name: Checkout source
      uses: actions/checkout@v4


    # Install Java
    - name: Setup JDK 11
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: maven


    # Install Chrome dependencies (CRITICAL)
    - name: Install Chrome dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          wget \
          unzip \
          curl \
          xvfb \
          libglib2.0-0 \
          libnss3 \
          libxss1 \
          libasound2 \
          libxtst6 \
          libatk-bridge2.0-0 \
          libgtk-3-0 \
          libgbm1


    # Install Chrome stable
    - name: Install Google Chrome
      run: |
        wget -q https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt install -y ./google-chrome-stable_current_amd64.deb

        google-chrome --version


    # Install matching ChromeDriver automatically
    - name: Install matching ChromeDriver
      run: |

        CHROME_VERSION=$(google-chrome --version | grep -oP '\d+\.\d+\.\d+')

        CHROME_MAJOR=$(echo $CHROME_VERSION | cut -d. -f1)

        echo "Chrome version: $CHROME_VERSION"
        echo "Chrome major: $CHROME_MAJOR"

        DRIVER_VERSION=$(curl -s \
        https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_$CHROME_MAJOR)

        echo "Driver version: $DRIVER_VERSION"

        wget -q \
        https://storage.googleapis.com/chrome-for-testing-public/$DRIVER_VERSION/linux64/chromedriver-linux64.zip

        unzip chromedriver-linux64.zip

        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/

        sudo chmod +x /usr/local/bin/chromedriver

        chromedriver --version


    # Verify network
    - name: Test network
      run: |
        curl -I https://www.google.com || true
        curl -I https://www.dienmayxanh.com || true


    # Build project
    - name: Build
      run: mvn -B clean compile


    # Run tests using virtual display
    - name: Run tests
      run: |
        xvfb-run --auto-servernum \
        --server-args="-screen 0 1920x1080x24" \
        mvn -B test


    # Upload reports even if failed
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: selenium-test-reports
        path: target/surefire-reports/


    # Upload screenshots if you add them later
    - name: Upload screenshots
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: screenshots
        path: screenshots/
        if-no-files-found: ignore
